<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IconForums - Discussion Community</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header / Navigation -->
  <header class="header">
    <div class="header-brand">
      <h1 class="logo">IconForums</h1>
      <p class="subtitle">Community Discussions</p>
    </div>
    <div class="header-actions">
      <div id="authStatus" class="auth-status"></div>
    </div>
  </header>

  <!-- Main Container -->
  <div class="container">
    <div class="main-grid">
      <!-- Sidebar -->
      <aside class="sidebar">
        <h3>New Post</h3>
        <form id="newPostForm" class="post-form">
          <input type="text" id="postTitle" placeholder="Post title..." maxlength="200" required>
          <textarea id="postBody" placeholder="What's on your mind?" maxlength="10000" rows="6" required></textarea>
          <select id="postCategory" class="form-input" required>
            <option value="">Select category...</option>
            <option value="General">General Discussion</option>
            <option value="Bugs">Bugs</option>
            <option value="Patches">Patches</option>
            <option value="Looking for team">Looking for Team</option>
            <option value="Market">Market</option>
          </select>
          <button type="submit" class="btn btn-primary">Post</button>
        </form>

        <div class="char-counts">
          <small>Title: <span id="titleCount">0</span>/200</small>
          <small>Body: <span id="bodyCount">0</span>/10000</small>
        </div>

        <h3 style="margin-top: 24px;">Categories</h3>
        <div class="categories">
          <button class="category-btn active" data-category="all">All Posts</button>
          <button class="category-btn" data-category="General">General</button>
          <button class="category-btn" data-category="Bugs">Bugs</button>
          <button class="category-btn" data-category="Patches">Patches</button>
          <button class="category-btn" data-category="Looking for team">Team</button>
          <button class="category-btn" data-category="Market">Market</button>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="posts-container">
        <div id="loadingSpinner" class="spinner hidden"></div>
        <div id="postsList" class="posts-list"></div>
        <div id="noPostsMessage" class="empty-state hidden">
          <p>No posts yet. Be the first to post!</p>
        </div>
        <div id="errorMessage" class="error-message hidden"></div>
      </main>
    </div>
  </div>

  <!-- Authentication Modal -->
  <div id="authModal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close">&times;</button>
      <div class="auth-tabs">
        <button class="tab-btn active" data-tab="login">Login</button>
        <button class="tab-btn" data-tab="signup">Sign Up</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form">
        <h2>Login</h2>
        <input type="text" id="loginEmail" placeholder="Email or username..." required>
        <input type="password" id="loginPassword" placeholder="Password..." required>
        <button type="submit" class="btn btn-primary">Login</button>
        <p class="form-message" id="loginMessage"></p>
      </form>

      <!-- Signup Form -->
      <form id="signupForm" class="auth-form hidden">
        <h2>Sign Up</h2>
        <input type="email" id="signupEmail" placeholder="Email..." required>
        <input type="text" id="signupUsername" placeholder="Username (3-20 chars)..." required>
        <input type="password" id="signupPassword" placeholder="Password (8+ chars, letters & numbers)..." required>
        <button type="submit" class="btn btn-primary">Create Account</button>
        <p class="form-message" id="signupMessage"></p>
      </form>
    </div>
  </div>

  <!-- Post Detail Modal -->
  <div id="postDetailModal" class="modal hidden">
    <div class="modal-content modal-large">
      <button class="modal-close">&times;</button>
      <div id="postDetailContent"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
