<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Post</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  body{font-family:Inter,system-ui,Segoe UI,Roboto,Arial;background:#071025;color:#e6eef6;padding:28px}
  .card{max-width:900px;margin:0 auto;background:#0b1220;padding:18px;border-radius:10px;border:1px solid rgba(255,255,255,0.03)}
  .meta{color:#94a3b8;font-size:13px;margin-bottom:8px}
  .content{margin:12px 0;color:#dbeafe}
  .comments{margin-top:18px}
  .comment{padding:10px;border-radius:8px;background:rgba(255,255,255,0.01);margin-bottom:10px}
  .btn{padding:8px 10px;border-radius:8px;border:0;background:#4fd1c5;color:#031019;cursor:pointer}
  textarea{width:100%;padding:8px;border-radius:8px;background:transparent;border:1px solid rgba(255,255,255,0.04);color:inherit}
  .small{font-size:12px;color:#94a3b8;margin-top:4px}
</style>
</head>
<body>
<div class="card">
  <div id="title"><strong>Loading…</strong></div>
  <div class="meta" id="meta"></div>
  <div class="content" id="content"> </div>

  <div style="display:flex;gap:12px;align-items:center">
    <button id="btnUp" class="btn">▲ Upvote</button>
    <button id="btnDown" class="btn">▼ Downvote</button>
    <div id="voteInfo" class="small"></div>
  </div>

  <div class="comments">
    <h3>Comments</h3>
    <div id="commentsList"></div>
    <div style="margin-top:12px">
      <textarea id="newComment" rows="4" placeholder="Write a comment..."></textarea>
      <div style="margin-top:8px"><button id="btnComment" class="btn">Post comment</button></div>
    </div>
  </div>
</div>

<script>
const LS_POSTS = 'ig_posts_v1';
const LS_USER = 'ig_user';
const postId = parseInt(new URLSearchParams(location.search).get('id'));
const el = id => document.getElementById(id);

let state = {
  currentUser: JSON.parse(localStorage.getItem(LS_USER) || 'null'),
  posts: JSON.parse(localStorage.getItem(LS_POSTS) || '[]'),
  post: null
};

function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function savePosts(){ localStorage.setItem(LS_POSTS, JSON.stringify(state.posts)); }

function loadPost() {
  const post = state.posts.find(p=>p.id===postId);
  if(!post) {
    el('title').innerText = 'Failed to load post';
    el('content').innerText = '';
    el('meta').innerText = '';
    el('voteInfo').innerText = '';
    return;
  }
  state.post = post;
  render();
}

function render(){
  const p = state.post;
  el('title').innerHTML = `<strong>${escapeHtml(p.title)}</strong>`;
  el('meta').textContent = `${p.category} • by ${escapeHtml(p.author)} • ${new Date(p.created).toLocaleString()}`;
  el('content').innerHTML = `<div>${escapeHtml(p.content)}</div>`;

  const votes = p.votes || {score:0,count:0};
  el('voteInfo').textContent = `Score: ${votes.score} • ${votes.count} votes`;

  const cl = el('commentsList'); cl.innerHTML = '';
  const comments = p.comments || [];
  if(!comments.length) cl.innerHTML = '<div class="small">No comments yet</div>';
  comments.forEach(c=>{
    const d = document.createElement('div');
    d.className = 'comment';
    d.innerHTML = `<div style="font-weight:700">${escapeHtml(c.author)}</div>
                   <div class="small">${new Date(c.created).toLocaleString()}</div>
                   <div style="margin-top:4px">${escapeHtml(c.content)}</div>`;
    cl.appendChild(d);
  });
}

function postComment(){
  if(!state.currentUser) return alert('Login required');
  const content = el('newComment').value.trim();
  if(!content) return alert('Write something');

  const p = state.post;
  if(!p.comments) p.comments = [];
  p.comments.push({
    author: state.currentUser.username,
    content,
    created: new Date().toISOString()
  });
  savePosts();
  el('newComment').value = '';
  loadPost();
}

function vote(val){
  if(!state.currentUser) return alert('Login required');
  const p = state.post;
  if(!p.votes) p.votes = {score:0,count:0};
  p.votes.score += val;
  p.votes.count += 1;
  savePosts();
  render();
}

el('btnComment').addEventListener('click', postComment);
el('btnUp').addEventListener('click', ()=>vote(1));
el('btnDown').addEventListener('click', ()=>vote(-1));

if(!postId) {
  document.body.innerHTML = '<div style="padding:28px;color:#fff">No post id specified (use ?id=POST_ID)</div>';
} else {
  loadPost();
}
</script>
</body>
</html>
